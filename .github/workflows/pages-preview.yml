name: GitHub Pages design preview

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/build_pages_preview.py'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and check static design preview
        run: python scripts/build_pages_preview.py --base-path "/${{ github.event.repository.name }}"
      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages_preview

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy design preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
